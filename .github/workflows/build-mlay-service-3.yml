name: Build Mlay Service 3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Extraire précisément le projet
        shell: bash
        run: |
          set -e
          ZIP_FILE="mlay-service.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : $ZIP_FILE est introuvable à la racine du dépôt."
            echo "ZIP présents :"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : settings.gradle est introuvable dans le ZIP."
            find extracted -maxdepth 4 -type f -print
            exit 1
          fi

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/google-services.json"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compiler l APK de test
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee build.log

      - name: Localiser l APK
        if: success()
        shell: bash
        run: |
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1)"
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Publier l APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mlay-service-3-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Publier le journal en cas d échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation-mlay-service-3
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: warn
          
