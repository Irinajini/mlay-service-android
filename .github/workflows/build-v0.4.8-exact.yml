name: Build Mlay Service v0.4.8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extraire le ZIP v0.4.8
        shell: bash
        run: |
          set -e
          ZIP_FILE="mlay-service-android-v0.4.8-auth-fixed.zip"
          test -f "$ZIP_FILE"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle.kts
          test -f extracted/app/google-services.json
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted" >> "$GITHUB_ENV"

      - name: Compiler l APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee build.log

      - name: Localiser l APK
        if: success()
        shell: bash
        run: |
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1)"
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Publier l APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mlay-service-v0.4.8-debug
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Publier le journal en cas d échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation-v0.4.8
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: warn
