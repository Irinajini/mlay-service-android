name: Build M'lay Service depuis ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraire le projet Android depuis le ZIP
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib
          import shutil
          import zipfile
          import os

          archives = sorted(pathlib.Path('.').glob('*mlay*.zip'))
          if not archives:
              raise SystemExit("Aucun ZIP 'mlay-service' trouvé dans le dépôt. "
                                "Assure-toi d'avoir uploadé mlay-service.zip à la racine.")

          archive = archives[-1]
          shutil.rmtree('extracted', ignore_errors=True)
          with zipfile.ZipFile(archive) as zf:
              zf.extractall('extracted')

          settings = next(pathlib.Path('extracted').rglob('settings.gradle'), None)
          if settings is None:
              raise SystemExit('settings.gradle introuvable dans le ZIP.')

          project = settings.parent.resolve()

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PROJECT_DIR={project}\n')

          print('ZIP utilisé :', archive)
          print('Projet détecté :', project)
          PY

      - name: Compiler l'APK de debug
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Localiser l'APK généré
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import pathlib

          project = pathlib.Path(os.environ['PROJECT_DIR'])
          apks = list(project.rglob('*debug*.apk'))
          if not apks:
              raise SystemExit('APK debug introuvable.')

          apk = apks[0].resolve()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'APK_FILE={apk}\n')
          print('APK trouvé :', apk)
          PY

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mlay-service-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Publier le journal en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: build.log
          if-no-files-found: ignore
