name: Build Mlay Service depuis ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraire le projet Android
        shell: bash
        run: python3 -c 'import os,pathlib,shutil,zipfile; z=sorted(pathlib.Path(".").glob("*mlay*.zip")); assert z,"Aucun ZIP Mlay trouvé"; shutil.rmtree("extracted",ignore_errors=True); zipfile.ZipFile(z[-1]).extractall("extracted"); s=next(pathlib.Path("extracted").rglob("settings.gradle.kts")); p=str(s.parent.resolve()); open(os.environ["GITHUB_ENV"],"a").write("PROJECT_DIR="+p+"\n"); print("ZIP utilisé:",z[-1]); print("Projet détecté:",p)'

      - name: Compiler l APK de test
        shell: bash
        run: gradle -p "$PROJECT_DIR" --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Localiser l APK
        shell: bash
        run: python3 -c 'import os,pathlib; a=list(pathlib.Path(os.environ["PROJECT_DIR"]).rglob("*debug*.apk")); assert a,"APK introuvable"; p=str(a[0].resolve()); open(os.environ["GITHUB_ENV"],"a").write("APK_FILE="+p+"\n"); print("APK trouvé:",p)'

      - name: Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: mlay-service-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Publier le journal en cas d échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: build.log
          if-no-files-found: ignore
