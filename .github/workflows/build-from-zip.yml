name: Build Mlay Service depuis ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraire automatiquement le ZIP Mlay
        shell: bash
        run: 
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f \( -iname 'mlay-service-android*.zip' -o -iname '*mlay*.zip' \) | head -n 1)"
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "Aucun ZIP Mlay trouvé dans le dépôt."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "Projet Android introuvable dans le ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compiler l'APK de test
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mlay-service-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
